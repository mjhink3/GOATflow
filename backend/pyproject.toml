[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goatflow-backend"
version = "0.1.0"
description = "GOATflow FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "google-genai>=1.0.0",
    "PyPDF2>=3.0.0",
    "pillow>=10.3.0",
    "python-multipart>=0.0.9",
    "groq>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.envs.default]
dependencies = []

